# Exhaustive establishment-protocol proof, as a required gate.
#
# proofs/establishment_model.py model-checks the ENTIRE reachable state space of
# the peer-to-peer connection-establishment protocol (N=2 and N=3, GoodNet +
# DegradedNet tiers) and exits non-zero if ANY reachable state is invalid, stuck,
# deadlocked, or cannot self-heal to CONNECTED. See proofs/README.md.
#
# proofs/capability_ledger_model.py model-checks the capability ledger defined in
# CONTRACT.md ("Capability ledger (append-only signed ops)", laws L1-L13). It is
# run twice: once for the laws, once with --self-test, which breaks one law at a
# time and requires the model to catch each. A green model that cannot go red is
# not evidence.
#
# The discipline this enforces: a protocol change must keep the proof green. If
# you change the establishment FSM (crates/filament-transport/src/{net,direct}.rs,
# cli/src/main.rs, frontend/src/lib/*.js,
# signaling.py, CONTRACT.md), update proofs/establishment_model.py + its
# state<->code mapping table FIRST, then make CI pass.

name: Proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  establishment-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Model-check establishment protocol (N=2, N=3; GoodNet + Degraded)
        run: python3 proofs/establishment_model.py
      - name: Model-check transport lifecycle (corpse / ack-loss / role; GoodNet + Degraded)
        run: python3 proofs/transport_lifecycle_model.py
      - name: Model-check transport upgrade (destroy-then-race vs build-alongside)
        run: python3 proofs/transport_upgrade_model.py
      - name: Model-check fleet auto-mesh (convergence / revocation / intruder)
        run: python3 proofs/fleet_automesh_model.py
      - name: Model-check stall ladder (calibration and recovery boundary)
        run: python3 proofs/stall_ladder_model.py
      - name: Model-check capability ledger (CONTRACT.md laws L1-L13)
        run: python3 proofs/capability_ledger_model.py
      - name: Capability-ledger model catches a broken law (mutation self-test)
        run: python3 proofs/capability_ledger_model.py --self-test
